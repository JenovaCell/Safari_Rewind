name: GTA6Countdown
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
targets:
  GTA6Countdown:
    type: application
    platform: macOS
    sources: [App]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GTA6Countdown
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: GTA6CountdownWidget
        embed: true
  GTA6CountdownWidget:
    type: app-extension
    platform: macOS
    sources: [Widget]
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: GTA VI Countdown
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GTA6Countdown.Widget
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
